<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار اتصال Perchance الصحيح</title><style>body{background:#0c1425;color:#fff;font:17px system-ui;margin:0;padding:22px;line-height:1.7}button{background:#4c83f7;border:0;border-radius:12px;padding:16px;color:white;font:inherit;width:100%;font-weight:700}#status{background:#1d2c46;padding:16px;border-radius:12px;margin:18px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:13px;direction:ltr;text-align:left}iframe{width:100%;height:240px;border:1px solid #39465f;border-radius:12px}</style></head><body><h2>اختبار الربط — العنوان الصحيح</h2><p>يختبر الاتصال مع مولّد Perchance الجديد، بدون توليد صور.</p><button id="start">ابدأ اختبار PING</button><div id="status">جاهز للاختبار</div><pre id="log"></pre><iframe id="generator" title="Perchance generator" src="https://null.perchance.org/zx088gx1yy"></iframe><script>
const frame=document.getElementById('generator'), statusEl=document.getElementById('status'), log=document.getElementById('log'), btn=document.getElementById('start');
let timer=null,tries=0,done=false;
function line(x){log.textContent+=x+"\n";}
function validOrigin(origin){try{const u=new URL(origin);return u.protocol==="https:"&&(u.hostname==="perchance.org"||u.hostname.endsWith(".perchance.org"));}catch{return false}}
window.addEventListener("message",e=>{if(e.source!==frame.contentWindow||!validOrigin(e.origin)||!e.data||e.data.type!=="PONG")return;done=true;clearInterval(timer);statusEl.textContent="✅ نجح الاتصال! وصل PONG من المولّد الجديد";line("PONG from "+e.origin);btn.disabled=false;});
frame.addEventListener("load",()=>line("iframe load event"));
btn.onclick=()=>{clearInterval(timer);tries=0;done=false;btn.disabled=true;log.textContent="";statusEl.textContent="جاري إرسال PING إلى المولّد الجديد…";const send=()=>{if(done)return;tries++;try{frame.contentWindow.postMessage({type:"PING"},"*");line("PING "+tries+" sent")}catch(e){line("Error: "+e.message)}if(tries>=20){clearInterval(timer);statusEl.textContent="❌ لم يصل PONG خلال 30 ثانية";btn.disabled=false;}};send();timer=setInterval(send,1500);};
</script></body></html>
