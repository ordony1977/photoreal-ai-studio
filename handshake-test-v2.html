<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار اتصال Perchance المحسن</title><style>body{font-family:system-ui;background:#101827;color:#fff;max-width:650px;margin:30px auto;padding:20px;line-height:1.7}button{font:inherit;font-weight:700;padding:13px 18px;background:#2678f2;color:#fff;border:0;border-radius:10px;width:100%;margin:8px 0}button:disabled{opacity:.55}#status,#details{padding:15px;background:#263246;border-radius:12px;margin-top:12px;white-space:pre-wrap}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0}</style></head><body><h2>اختبار الاتصال — النسخة المحسّنة</h2><p>هذا اختبار PING/PONG فقط، لا يولّد صورًا ولا يعدّل مولّدك.</p><button id="test">ابدأ اختبار الاتصال</button><div id="status" role="status">جاهز.</div><div id="details">لم يبدأ الاختبار بعد.</div><iframe id="generator" title="Perchance handshake" referrerpolicy="no-referrer"></iframe><script>
const frame=document.getElementById('generator'), status=document.getElementById('status'), details=document.getElementById('details'), button=document.getElementById('test');
let timer=null, run=0, loaded=false, tries=0, start=0, sourceUrl='';
const targets=[{url:'https://perchance.org/lbmi96ly1g',origin:'https://perchance.org'},{url:'https://null.perchance.org/lbmi96ly1g',origin:'https://null.perchance.org'}];
const log=[];function report(t){log.push(t);details.textContent=log.join('\n');}
function stop(success){clearInterval(timer);timer=null;button.disabled=false;status.textContent=success?'✅ وصل PONG! الاتصال نجح.':'❌ لم يصل PONG. راجع تفاصيل المحاولة أدناه.';}
window.addEventListener('message',e=>{if(!timer||e.source!==frame.contentWindow||!e.data||e.data.type!=='PONG')return;if(!['https://perchance.org','https://null.perchance.org'].includes(e.origin))return;report('وصل PONG من: '+e.origin);stop(true);});
frame.addEventListener('load',()=>{loaded=true;if(timer)report('حدث تحميل iframe: '+sourceUrl);});
button.onclick=()=>{if(timer)return;run++;log.length=0;button.disabled=true;loaded=false;tries=0;start=Date.now();sourceUrl=targets[0].url;frame.src=sourceUrl;status.textContent='⏳ جاري تحميل المولّد واختبار الاتصال…';report('بدأ الاختبار على '+location.origin);report('الهدف الأول: '+sourceUrl);
 timer=setInterval(()=>{const elapsed=Date.now()-start;if(elapsed>60000){stop(false);return;}if(elapsed>30000&&sourceUrl===targets[0].url){loaded=false;sourceUrl=targets[1].url;frame.src=sourceUrl;report('تجربة العنوان البديل: '+sourceUrl);}if(!loaded)return;const origin=sourceUrl.startsWith('https://null.')?targets[1].origin:targets[0].origin;try{frame.contentWindow.postMessage({type:'PING'},origin);tries++;if(tries%5===1)report('أُرسلت PING رقم '+tries+' إلى '+origin);}catch(err){report('خطأ في الإرسال: '+err.message);}},1000);
};
</script></body></html>
