<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار اتصال Perchance v3</title><style>body{background:#0b1425;color:#f5f7ff;font:16px system-ui;padding:20px;line-height:1.8}button{background:#568bff;color:white;border:0;border-radius:12px;padding:14px;width:100%;font-size:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2b43;padding:15px;border-radius:12px;direction:ltr;text-align:left}iframe{width:100%;height:200px;border:1px solid #456;border-radius:12px}</style><h2>اختبار PING / PONG — v3</h2><p>يفحص الإطار الرئيسي والإطارات الداخلية. لا يولّد صورًا.</p><button id="run">ابدأ الاختبار</button><p id="status">جاهز</p><pre id="log"></pre><iframe id="gen" title="Perchance" src="https://perchance.org/lbmi96ly1g"></iframe><script>
const f=document.getElementById('gen'),log=document.getElementById('log'),status=document.getElementById('status'),btn=document.getElementById('run');let timer=null,targets=[],attempt=0;
function note(s){log.textContent+=s+'\n';}
function collect(win,depth=0,out=[],seen=new Set()){if(depth>5||seen.has(win))return out;seen.add(win);let n=0;try{n=win.length}catch(e){note('frame length error '+e.message)}for(let i=0;i<Math.min(n,100);i++){try{const child=win[i];if(!seen.has(child)){out.push(child);collect(child,depth+1,out,seen)}}catch(e){note('child error '+e.message)}}return out}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='PONG'){const idx=targets.indexOf(e.source);note('PONG received! index='+idx+' origin='+e.origin);status.textContent='✅ وصل PONG';clearInterval(timer);btn.disabled=false;}});
function ping(){attempt++;targets=[f.contentWindow,...collect(f.contentWindow)];note('Attempt '+attempt+': '+targets.length+' window(s)');targets.forEach((w,i)=>{try{w.postMessage({type:'PING',id:attempt},'*')}catch(e){note('send error '+i+': '+e.message)}});if(attempt>=15){clearInterval(timer);if(!status.textContent.includes('PONG'))status.textContent='❌ لم يصل PONG بعد 15 محاولة';btn.disabled=false}}
btn.onclick=()=>{clearInterval(timer);log.textContent='';attempt=0;btn.disabled=true;status.textContent='جاري الفحص…';ping();timer=setInterval(ping,1500)};
f.addEventListener('load',()=>note('iframe load event'));
</script></html>
